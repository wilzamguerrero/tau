name: Pruebas y compilacion

# Se ejecuta en cada push y en cada pull request. Si las notas se calculan mal
# o el sitio no compila, es mejor enterarse aqui que cuando el despliegue deje
# la pagina en blanco o suba un 0,0 a TAU.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Pruebas del nucleo
        run: npm test

      - name: Compilar el sitio
        run: npm run build

      - name: Compilar la version de un solo archivo
        run: npm run build:offline
